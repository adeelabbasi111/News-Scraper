<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Research</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>AI News Research & Content Generator</h1>
        
        <form id="researchForm">
            <div class="form-group">
                <label>Topic / Keyword</label>
                <input type="text" id="topic" placeholder="e.g. Babar Azam" required>
            </div>
            
            <div class="form-group">
                <label>Category</label>
                <select id="category">
                    <option value="Cricket">Cricket</option>
                    <option value="Politics">Politics</option>
                    <option value="General News">General News</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Content Type</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="contentType" value="SHORT_FORM" checked> SHORT FORM
                    </label>
                    <label>
                        <input type="radio" name="contentType" value="LONG_FORM"> LONG FORM
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label>Time Range</label>
                <select id="timeRange">
                    <option value="24h">Last 24 hours</option>
                    <option value="3d">Last 3 days</option>
                    <option value="7d">Last 7 days</option>
                </select>
            </div>
            
            <div id="creditEstimate" class="estimate-box">
                Estimated Usage: 10 credits
            </div>
            
            <button type="submit">START RESEARCH</button>
        </form>
        
        <div id="progressArea" class="hidden">
            <h3>Progress</h3>
            <div id="progressLog"></div>
        </div>
    </div>
    <script src="/static/app.js?v=2"></script>
</body>
</html>
